<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Neon Velocity: Custom Edition</title>
    <style>
        /* --- CSS STYLES --- */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: 'Orbitron', sans-serif;
            color: white;
            height: 100vh;
            width: 100vw;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Container */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* HUD */
        .hud-panel {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            pointer-events: none;
        }
        
        .score-box div { margin-bottom: 5px; }
        .label { font-size: 0.8rem; color: #a0a0a0; }
        .value { font-size: 1.4rem; font-weight: bold; color: #fff; }

        /* Screens (Menu / Settings / Game Over) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #00f260, #0575e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-align: center;
            filter: drop-shadow(0 0 15px rgba(0,255,100,0.5));
        }

        h2 { font-size: 2rem; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 15px; }

        /* Buttons */
        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            font-family: 'Orbitron', sans-serif;
            border-radius: 30px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 0 15px rgba(0, 242, 96, 0.1);
            transition: all 0.2s;
            text-transform: uppercase;
            min-width: 200px;
        }

        .btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.2); }
        .btn:hover { box-shadow: 0 0 25px rgba(0, 242, 96, 0.4); border-color: #00f260; }

        .btn.secondary {
            border-color: rgba(255, 255, 255, 0.1);
            font-size: 1.2rem;
            padding: 12px 30px;
        }
        .btn.secondary:hover { border-color: #0575e6; box-shadow: 0 0 25px rgba(5, 117, 230, 0.4); }

        /* Settings Specifics */
        .diff-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn.diff-opt {
            border: 1px solid #555;
            color: #888;
            background: rgba(0,0,0,0.3);
            box-shadow: none;
        }

        .btn.diff-opt.selected {
            border: 2px solid #00f260;
            color: #fff;
            background: rgba(0, 242, 96, 0.2);
            box-shadow: 0 0 20px rgba(0, 242, 96, 0.4);
            transform: scale(1.05);
        }

        /* Touch Visualizer */
        .touch-zone-indicator {
            position: absolute;
            bottom: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: rgba(255,255,255,0.3);
            transition: all 0.1s;
        }
        #left-zone { left: 30px; }
        #right-zone { right: 30px; }
        .active-zone { background: rgba(0, 242, 96, 0.3); border-color: #00f260; transform: scale(1.1); }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .hud-panel { padding: 10px; font-size: 1rem; }
            .btn { min-width: 160px; padding: 12px 25px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- HUD -->
        <div class="hud-panel" id="hud">
            <div class="score-box">
                <div class="label">SCORE</div>
                <div class="value" id="scoreVal">0</div>
            </div>
            <div class="score-box" style="text-align: right;">
                <div class="label">HIGH SCORE</div>
                <div class="value" id="highScoreVal">0</div>
                <div class="label" style="margin-top:5px; color:#00f260">MODE: <span id="modeVal">MED</span></div>
            </div>
        </div>

        <div id="left-zone" class="touch-zone-indicator">&larr;</div>
        <div id="right-zone" class="touch-zone-indicator">&rarr;</div>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="mainMenu" class="screen">
        <h1>Neon Velocity</h1>
        <button class="btn" onclick="startGame()">PLAY</button>
        <button class="btn secondary" onclick="showSettings()">SETTINGS</button>
    </div>

    <!-- SETTINGS SCREEN -->
    <div id="settingsScreen" class="screen hidden">
        <h2>SETTINGS</h2>
        <div style="color:#aaa; margin-bottom:10px;">Select Difficulty:</div>
        
        <div class="diff-container">
            <button id="diff-easy" class="btn diff-opt" onclick="setDifficulty('easy')">EASY</button>
            <button id="diff-med" class="btn diff-opt selected" onclick="setDifficulty('medium')">MEDIUM</button>
            <button id="diff-hard" class="btn diff-opt" onclick="setDifficulty('hard')">HARD</button>
        </div>

        <p id="diff-desc" style="color:#00f260; font-size:0.9rem; margin-bottom:20px; height: 1.2em;">Balanced traffic & handling.</p>

        <button class="btn secondary" onclick="closeSettings()">BACK</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOverScreen" class="screen hidden">
        <h2>CRASHED!</h2>
        <div style="font-size: 1.2rem; color: #fff; margin: 10px 0;">Final Score: <span id="finalScore" style="color:#00f260">0</span></div>
        <button class="btn" onclick="startGame()">Try Again</button>
        <button class="btn secondary" onclick="goToMenu()">Main Menu</button>
    </div>

    <script>
        /**
         * NEON VELOCITY V2 - With Settings & Difficulty
         */

        // --- CONSTANTS & SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game State
        let gameRunning = false;
        let frameId;
        let score = 0;
        let highScore = localStorage.getItem('neon_racer_highscore') || 0;
        let speedMultiplier = 1;
        let baseSpeed = 0;
        let distanceTraveled = 0;

        // Difficulty Settings
        const difficulties = {
            easy: {
                label: 'EASY',
                trafficRate: 0.012,    // Low traffic
                handling: 0.35,        // Very snappy/grippy (0.1 is drift, 1.0 is instant)
                speedScale: 1.0,
                desc: "Less traffic. Easy steering."
            },
            medium: {
                label: 'MED',
                trafficRate: 0.025,    // ~2x Easy
                handling: 0.20,        // Standard weight
                speedScale: 1.1,
                desc: "Balanced traffic & handling."
            },
            hard: {
                label: 'HARD',
                trafficRate: 0.05,     // ~2x Medium, ~4x Easy
                handling: 0.12,        // Slippery/Drifty
                speedScale: 1.3,
                desc: "Heavy traffic. Drifty steering."
            }
        };

        let currentDiff = 'medium';

        // UI Elements
        const scoreEl = document.getElementById('scoreVal');
        const highScoreEl = document.getElementById('highScoreVal');
        const modeEl = document.getElementById('modeVal');
        const finalScoreEl = document.getElementById('finalScore');
        
        const mainMenu = document.getElementById('mainMenu');
        const settingsScreen = document.getElementById('settingsScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        
        const leftZone = document.getElementById('left-zone');
        const rightZone = document.getElementById('right-zone');
        const diffDesc = document.getElementById('diff-desc');

        // Input State
        const input = { left: false, right: false };

        // --- AUDIO SYSTEM ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(1800, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'crash') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            } else if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            }
        }

        // --- MENU LOGIC ---

        function showSettings() {
            playSound('click');
            mainMenu.classList.add('hidden');
            settingsScreen.classList.remove('hidden');
        }

        function closeSettings() {
            playSound('click');
            settingsScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        }

        function setDifficulty(level) {
            playSound('click');
            currentDiff = level;
            
            // UI Visual Update
            document.querySelectorAll('.diff-opt').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`diff-${level}`).classList.add('selected');
            
            // Description Update
            diffDesc.innerText = difficulties[level].desc;
        }

        function goToMenu() {
            playSound('click');
            gameOverScreen.classList.add('hidden');
            mainMenu.classList.remove('hidden');
        }

        // --- CLASSES ---

        class Particle {
            constructor(x, y, color, speed) {
                this.x = x; this.y = y; this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const v = Math.random() * speed;
                this.vx = Math.cos(angle) * v; this.vy = Math.sin(angle) * v;
                this.life = 1.0; this.decay = Math.random() * 0.03 + 0.02;
                this.size = Math.random() * 3 + 2;
            }
            update() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; }
            draw(ctx) {
                ctx.globalAlpha = this.life; ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class Car {
            constructor(x, y, width, height, color, isPlayer = false) {
                this.x = x; this.y = y; this.width = width; this.height = height;
                this.color = color; this.isPlayer = isPlayer;
                this.angle = 0; this.targetAngle = 0;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                
                if (this.isPlayer) {
                    this.angle += (this.targetAngle - this.angle) * 0.15;
                    ctx.rotate(this.angle);
                }
                
                ctx.shadowColor = this.color; ctx.shadowBlur = 15;
                ctx.fillStyle = this.color;
                this.roundRect(ctx, -this.width/2, -this.height/2, this.width, this.height, 8);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = "rgba(0,0,0,0.5)";
                this.roundRect(ctx, -this.width/2 + this.width*0.15, -this.height/2 + this.height*0.25, this.width - this.width*0.3, this.height*0.55, 4);
                ctx.fill();

                if (this.isPlayer) {
                    this.drawLight(ctx, -this.width/2 + 4, -this.height/2, 6, 8, '#fff', true);
                    this.drawLight(ctx, this.width/2 - 10, -this.height/2, 6, 8, '#fff', true);
                    this.drawLight(ctx, -this.width/2 + 4, this.height/2 - 2, 6, 4, '#f00', false);
                    this.drawLight(ctx, this.width/2 - 10, this.height/2 - 2, 6, 4, '#f00', false);
                } else {
                    this.drawLight(ctx, -this.width/2 + 4, this.height/2, 6, 8, '#ff9', false);
                    this.drawLight(ctx, this.width/2 - 10, this.height/2, 6, 8, '#ff9', false);
                    this.drawLight(ctx, -this.width/2 + 4, -this.height/2 - 2, 6, 4, '#f00', false);
                    this.drawLight(ctx, this.width/2 - 10, -this.height/2 - 2, 6, 4, '#f00', false);
                }
                ctx.restore();
            }

            drawLight(ctx, x, y, w, h, color, isBeam) {
                ctx.fillStyle = color; ctx.fillRect(x, y, w, h);
                if (isBeam) {
                    ctx.save();
                    const grd = ctx.createLinearGradient(0, y, 0, y - 60);
                    grd.addColorStop(0, "rgba(255,255,255,0.4)"); grd.addColorStop(1, "rgba(255,255,255,0)");
                    ctx.fillStyle = grd;
                    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y);
                    ctx.lineTo(x + w + 10, y - 60); ctx.lineTo(x - 10, y - 60);
                    ctx.fill(); ctx.restore();
                }
            }
            roundRect(ctx, x, y, w, h, r) {
                if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
                ctx.beginPath(); ctx.moveTo(x + r, y);
                ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
                ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
                ctx.closePath();
            }
        }

        class Coin {
            constructor(x, y, size) {
                this.x = x; this.y = y; this.size = size; this.rotation = 0;
            }
            update(speed) { this.y += speed; this.rotation += 0.1; }
            draw(ctx) {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.fillStyle = "#FFD700"; ctx.shadowColor = "#FFA500"; ctx.shadowBlur = 10;
                ctx.beginPath();
                for (let i = 0; i < 6; i++) ctx.lineTo(this.size * Math.cos(i * 2 * Math.PI / 6), this.size * Math.sin(i * 2 * Math.PI / 6));
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = "#FFA500"; ctx.beginPath(); ctx.arc(0, 0, this.size * 0.6, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        // --- GAME VARIABLES ---
        let player;
        let enemies = [];
        let coins = [];
        let particles = [];
        let roadOffset = 0;
        let laneWidth, carWidth, carHeight;

        // --- INIT & RESIZE ---
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const lanes = 4;
            laneWidth = canvas.width / lanes;
            carWidth = Math.min(laneWidth * 0.6, 60);
            carHeight = carWidth * 1.8;
            baseSpeed = canvas.height * 0.008;

            if (player) {
                player.width = carWidth; player.height = carHeight;
                player.y = canvas.height - carHeight - 50;
            }
        }
        window.addEventListener('resize', resize);
        resize();
        highScoreEl.innerText = highScore;

        // --- INPUT HANDLING ---
        function handleInput(type, active) {
            if (type === 'left') { input.left = active; active ? leftZone.classList.add('active-zone') : leftZone.classList.remove('active-zone'); }
            if (type === 'right') { input.right = active; active ? rightZone.classList.add('active-zone') : rightZone.classList.remove('active-zone'); }
        }
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleInput('left', true);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleInput('right', true);
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') handleInput('left', false);
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') handleInput('right', false);
        });
        window.addEventListener('touchstart', e => {
            if (!gameRunning) return;
            const mid = window.innerWidth / 2;
            for (let i = 0; i < e.touches.length; i++) {
                e.touches[i].clientX < mid ? handleInput('left', true) : handleInput('right', true);
            }
        }, {passive: false});
        window.addEventListener('touchend', e => {
            if (!gameRunning) return;
            if (e.touches.length === 0) { handleInput('left', false); handleInput('right', false); }
            else {
                let hasLeft = false, hasRight = false;
                const mid = window.innerWidth / 2;
                for (let i = 0; i < e.touches.length; i++) {
                    e.touches[i].clientX < mid ? hasLeft = true : hasRight = true;
                }
                handleInput('left', hasLeft); handleInput('right', hasRight);
            }
        });

        // --- GAME LOGIC ---

        function createPlayer() {
            const startX = canvas.width / 2 - carWidth / 2;
            const startY = canvas.height - carHeight - 50;
            player = new Car(startX, startY, carWidth, carHeight, '#00f260', true);
        }

        function spawnEnemy(currentSpeed) {
            const diffConfig = difficulties[currentDiff];
            // Spawn Rate calculation: Base rate * multiplier based on speed
            if (Math.random() < diffConfig.trafficRate * speedMultiplier) {
                const lanes = Math.floor(canvas.width / laneWidth);
                const laneIndex = Math.floor(Math.random() * lanes);
                const ex = (laneIndex * laneWidth) + (laneWidth / 2) - carWidth / 2;
                const ey = -carHeight * 2;

                let safe = true;
                for(let e of enemies) if (e.y < carHeight * 2 && Math.abs(e.x - ex) < 10) safe = false;

                if (safe) {
                    const colors = ['#ff0055', '#ff9900', '#00ccff', '#aa00ff'];
                    const enemy = new Car(ex, ey, carWidth, carHeight, colors[Math.floor(Math.random() * colors.length)]);
                    // Enemy Speed
                    const speedVar = (Math.random() * 0.4) + 0.8; 
                    enemy.velocity = currentSpeed * 0.6 * speedVar; 
                    enemies.push(enemy);
                }
            }
        }

        function update() {
            const diffConfig = difficulties[currentDiff];

            // 1. Scaling
            speedMultiplier += 0.0003; 
            
            // 2. Player Movement (Handling modified by difficulty)
            const moveSpeed = laneWidth * 0.16; // Top speed
            let dx = 0;
            if (input.left) dx = -moveSpeed;
            if (input.right) dx = moveSpeed;

            // Apply Handling (Easing factor)
            player.x += (dx * 1.5) * diffConfig.handling; 
            
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            player.targetAngle = (dx * 0.2) * (Math.PI / 180);

            // 3. Environment
            if (Math.random() < 0.01) coins.push(new Coin(Math.random() * (canvas.width - 50) + 25, -50, laneWidth * 0.15));
            
            const currentSpeed = (baseSpeed * speedMultiplier) * diffConfig.speedScale;
            spawnEnemy(currentSpeed);

            roadOffset += currentSpeed;
            if (roadOffset >= 80) roadOffset = 0;

            // 4. Update Entities
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += currentSpeed + (e.velocity || 0);
                
                // Slightly tighter hitboxes for gameplay feel
                if (e.x < player.x + player.width - 5 && e.x + e.width > player.x + 5 &&
                    e.y < player.y + player.height - 5 && e.y + e.height > player.y + 5) {
                    gameOver(player.x + player.width/2, player.y + player.height/2);
                }
                if (e.y > canvas.height) enemies.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                let c = coins[i];
                c.update(currentSpeed);
                const cx = c.x, cy = c.y;
                if (cx > player.x && cx < player.x + player.width && cy > player.y && cy < player.y + player.height) {
                    score += 100;
                    playSound('coin');
                    coins.splice(i, 1);
                } else if (c.y > canvas.height) coins.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            score++;
            scoreEl.innerText = score;
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function draw() {
            ctx.fillStyle = "#2c3e50"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Road Lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)"; ctx.lineWidth = 4;
            ctx.setLineDash([40, 40]); ctx.lineDashOffset = -roadOffset;
            const numLanes = Math.floor(canvas.width / laneWidth);
            for (let i = 1; i < numLanes; i++) {
                ctx.beginPath(); ctx.moveTo(i * laneWidth, -50); ctx.lineTo(i * laneWidth, canvas.height + 50); ctx.stroke();
            }
            ctx.setLineDash([]);

            coins.forEach(c => c.draw(ctx));
            enemies.forEach(e => e.draw(ctx));
            player.draw(ctx);
            particles.forEach(p => p.draw(ctx));

            // Vignette
            const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height/2, canvas.width/2, canvas.height/2, canvas.height);
            grad.addColorStop(0, "transparent"); grad.addColorStop(1, "rgba(0,0,0,0.6)");
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function loop() {
            if (!gameRunning) return;
            update();
            draw();
            frameId = requestAnimationFrame(loop);
        }

        function startGame() {
            if (gameRunning) return;
            playSound('click');

            score = 0;
            speedMultiplier = 1;
            enemies = [];
            coins = [];
            particles = [];
            input.left = false; input.right = false;

            createPlayer();
            resize();
            modeEl.innerText = difficulties[currentDiff].label;

            mainMenu.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            settingsScreen.classList.add('hidden');
            document.getElementById('ui-layer').style.pointerEvents = "none";
            
            gameRunning = true;
            loop();
        }

        function gameOver(x, y) {
            gameRunning = false;
            cancelAnimationFrame(frameId);
            playSound('crash');
            
            // Explosion
            for (let i = 0; i < 20; i++) particles.push(new Particle(x, y, '#ff0055', 10));
            draw(); 

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_racer_highscore', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
            document.getElementById('ui-layer').style.pointerEvents = "auto";
        }
    </script>
</body>
</html>
